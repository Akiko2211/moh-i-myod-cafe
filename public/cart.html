<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мох и Мёд - уютная кофейня</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;500;700&display=swap"
        rel="stylesheet">

    <script src="js/api.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/cart-page.js" defer></script>

</head>

<body>

    <header>
        <a href="/" class="logo">Мох и Мёд</a>

        <nav>
            <ul>
                <li><a href="/#menu">Меню</a></li>
                <li><a href="/#about">О нас</a></li>
                <li><a href="/#booking">Бронь</a></li>
                <li><a href="/#contacts">Контакты</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a href="/#booking" class="btn">Забронировать столик</a>
            <a href="cart.html" class="cart-link">
                Корзина <span class="cart-count" id="cart-count">0</span>
            </a>
        </div>

    </header>

    <main class="cart-page">
        <h1 class="section-title">Корзина</h1>
        <div class="cart-layout">
            <div class="cart-items" id="cart-items"></div>

            <aside class="cart-summary">
                <h2>Итог</h2>
                <p class="cart-total">
                    <span>Сумма:</span>
                    <strong id="cart-total">0&nbsp;₽</strong>
                </p>
                <form class="checkout-form" id="checkout-form">
                    <label class="form-field">
                        <span>Имя</span>
                        <input type="text" name="name" required minlength="2" maxlength="50" autocomplete="name">
                    </label>

                    <label class="form-field">
                        <span>Телефон</span>
                        <input type="tel" name="phone" required placeholder="+7 900 123-45-67" autocomplete="tel">
                    </label>

                    <label class="form-field">
                        <span>Почта для чека <small>(необязательно)</small></span>
                        <input type="email" name="email" autocomplete="email">
                    </label>

                    <label class="form-field">
                        <span>Комментарий <small>(необязательно)</small></span>
                        <textarea name="comment" rows="3" maxlength="300" placeholder="Например: без сахара, заберу в 15:00"></textarea>
                    </label>

                    <button class="btn cart-checkout" id="checkout-btn" type="submit">Оформить заказ</button>
                    <p class="checkout-message" id="checkout-message" role="status"></p>
                </form>
            </aside>
        </div>
    </main>

    <footer></footer>
</body>

</html>
