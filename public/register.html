<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Мох и Мёд</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;500;700&display=swap"
        rel="stylesheet">

    <script src="js/api.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/auth-page.js" defer></script>
</head>

<body>

    <header>
        <a href="/" class="logo">Мох и Мёд</a>

        <nav>
            <ul>
                <li><a href="/#menu">Меню</a></li>
                <li><a href="/#about">О нас</a></li>
                <li><a href="/#booking">Бронь</a></li>
                <li><a href="/#contacts">Контакты</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a href="/#booking" class="btn">Забронировать столик</a>
            <a href="cart.html" class="cart-link">
                Корзина <span class="cart-count" id="cart-count">0</span>
            </a>
            <div class="user-menu" id="user-menu">
                <a href="login.html">Войти</a>
            </div>
        </div>

    </header>

    <main class="auth-page">
        <form class="auth-form" id="register-form">
            <h1 class="auth-title">Регистрация</h1>

            <label class="form-field">
                <span>Имя</span>
                <input type="text" name="name" required autocomplete="name">
            </label>

            <label class="form-field">
                <span>Почта</span>
                <input type="email" name="email" required autocomplete="email">
            </label>

            <label class="form-field">
                <span>Пароль</span>
                <input type="password" name="password" required minlength="8" autocomplete="new-password">
            </label>

            <p class="form-error" id="form-error" role="alert"></p>

            <button class="btn auth-submit" type="submit">Зарегистрироваться</button>

            <p class="auth-switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        </form>
    </main>

    <footer></footer>
</body>

</html>
